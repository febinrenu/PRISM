# PRISM reverse proxy (Module F). Routes the public API + app behind one origin.
events { worker_connections 1024; }

http {
    upstream frontend { server frontend:3000; }
    upstream backend  { server backend:8000; }

    # SSE needs buffering off and long read timeouts.
    proxy_http_version 1.1;
    proxy_read_timeout 3600s;
    proxy_buffering off;

    # Per-address request limits for the API: sign-in is tight, the rest generous (a page makes many
    # calls) and the expensive routes are further capped in the application.
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=3r/s;
    limit_req_status 429;

    server {
        listen 80;
        server_name _;
        client_max_body_size 50m;

        # Backend API surfaces.
        # X-Forwarded-For is overwritten, never appended to: the backend's throttles trust it, so a
        # client must not be able to supply its own.
        location /api/auth/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
        location /api/ {
            limit_req zone=api burst=100 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
        location /v1/ {
            limit_req zone=api burst=100 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
        location /health { proxy_pass http://backend; }
        location /docs   { proxy_pass http://backend; }
        location /openapi.json { proxy_pass http://backend; }

        # Everything else → Next.js frontend.
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
