# PRISM reverse proxy (Module F). Routes the public API + app behind one origin.
events { worker_connections 1024; }

http {
    upstream frontend { server frontend:3000; }
    upstream backend  { server backend:8000; }

    # SSE needs buffering off and long read timeouts.
    proxy_http_version 1.1;
    proxy_read_timeout 3600s;
    proxy_buffering off;

    server {
        listen 80;
        server_name _;
        client_max_body_size 50m;

        # Backend API surfaces.
        location /api/ { proxy_pass http://backend; proxy_set_header Host $host; }
        location /v1/  { proxy_pass http://backend; proxy_set_header Host $host; }
        location /health { proxy_pass http://backend; }
        location /docs   { proxy_pass http://backend; }
        location /openapi.json { proxy_pass http://backend; }

        # Everything else → Next.js frontend.
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
