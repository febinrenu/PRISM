<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="752" viewBox="0 0 1200 752" role="img" aria-labelledby="t d">
  <title id="t">PRISM system architecture</title>
  <desc id="d">Clients reach nginx, which fronts a Next.js frontend and a FastAPI backend. The backend routes to six domain services, which use model backends and five kinds of state.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L10 5 L0 9 z" fill="#FF4F1F"/>
    </marker>
    <style>
      .bg{fill:#0C0D0E}
      .panel{fill:#131517;stroke:#2B2E33;stroke-width:1}
      .box{fill:#1A1D20;stroke:#32363C;stroke-width:1}
      .bar{fill:#FF4F1F}
      .lab{font:600 10.5px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;letter-spacing:.14em;fill:#8E8B83}
      .t{font:600 13px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#F1EDE4}
      .s{font:400 11px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#A8A49A}
      .ar{fill:none;stroke:#FF4F1F;stroke-width:1.5}
      .db{fill:#14201C;stroke:#2C5B4D;stroke-width:1}
      .dbt{font:600 13px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#8FE0C4}
    </style>
  </defs>
  <rect class="bg" width="1200" height="752" rx="14"/>

  <!-- clients -->
  <rect class="panel" x="40" y="18" width="1120" height="84" rx="10"/>
  <text class="lab" x="58" y="38">CLIENTS</text>
  <rect class="box" x="58" y="48" width="536" height="42" rx="7"/>
  <text class="t" x="74" y="66">Browser</text><text class="s" x="74" y="81">Next.js 14 · React 18 · TypeScript</text>
  <rect class="box" x="606" y="48" width="536" height="42" rx="7"/>
  <text class="t" x="622" y="66">API consumers</text><text class="s" x="622" y="81">Versioned /v1 REST API · bearer keys prism_sk_…</text>
  <path class="ar" d="M600 102 V130" marker-end="url(#a)"/>

  <!-- edge -->
  <rect class="panel" x="40" y="130" width="1120" height="58" rx="10"/>
  <text class="lab" x="58" y="150">EDGE</text>
  <text class="t" x="58" y="172">nginx</text>
  <text class="s" x="118" y="172">one origin · overwrites X-Forwarded-For · request-rate zones · only public entry point</text>
  <path class="ar" d="M210 188 V218" marker-end="url(#a)"/>
  <path class="ar" d="M780 188 V218" marker-end="url(#a)"/>

  <!-- frontend -->
  <rect class="panel" x="40" y="218" width="340" height="324" rx="10"/>
  <text class="lab" x="58" y="238">FRONTEND · NEXT.JS STANDALONE · NON-ROOT</text>
  <rect class="box" x="56" y="250" width="308" height="86" rx="7"/><rect class="bar" x="56" y="250" width="3" height="86"/>
  <text class="t" x="74" y="272">App Router</text>
  <text class="s" x="74" y="290">Workspace · Policy sandbox · Ask</text>
  <text class="s" x="74" y="306">Statutes · Research · Compare</text>
  <text class="s" x="74" y="322">Annotate · Dashboard · Admin</text>
  <rect class="box" x="56" y="348" width="308" height="64" rx="7"/><rect class="bar" x="56" y="348" width="3" height="64"/>
  <text class="t" x="74" y="370">Visual layer</text>
  <text class="s" x="74" y="388">three.js / R3F · d3 · xyflow</text>
  <text class="s" x="74" y="402">Recharts · pdf.js</text>
  <rect class="box" x="56" y="424" width="308" height="64" rx="7"/><rect class="bar" x="56" y="424" width="3" height="64"/>
  <text class="t" x="74" y="446">Design system</text>
  <text class="s" x="74" y="464">Dark and light tokens, contrast-checked</text>
  <text class="s" x="74" y="478">axe-core: 0 violations on every route</text>
  <rect class="box" x="56" y="500" width="308" height="32" rx="7"/>
  <text class="s" x="74" y="520">Server-sent events for long jobs and Ask</text>

  <!-- backend -->
  <rect class="panel" x="400" y="218" width="760" height="324" rx="10"/>
  <text class="lab" x="416" y="238">BACKEND · FASTAPI · PYTHON 3.12 · NON-ROOT · LOOPBACK-BOUND</text>
  <rect class="box" x="416" y="248" width="728" height="40" rx="7"/><rect class="bar" x="416" y="248" width="3" height="40"/>
  <text class="t" x="434" y="272">Middleware</text>
  <text class="s" x="528" y="272">CORS · security headers · slowapi limits · JWT or API-key auth · document ownership guard</text>
  <rect class="box" x="416" y="298" width="360" height="40" rx="7"/><rect class="bar" x="416" y="298" width="3" height="40"/>
  <text class="t" x="434" y="322">16 routers</text><text class="s" x="520" y="322">86 routes · thin, no domain logic</text>
  <rect class="box" x="788" y="298" width="356" height="40" rx="7"/><rect class="bar" x="788" y="298" width="3" height="40"/>
  <text class="t" x="806" y="322">Job manager</text><text class="s" x="898" y="322">asyncio tasks · replayable history</text>

  <text class="lab" x="416" y="362">DOMAIN SERVICES</text>
  <g>
    <rect class="box" x="416" y="372" width="234" height="72" rx="7"/><rect class="bar" x="416" y="372" width="3" height="72"/>
    <text class="t" x="432" y="394">Ingestion</text><text class="s" x="432" y="412">PDF triage · glyph decoding · OCR</text><text class="s" x="432" y="428">statute AST · segmentation</text>
    <rect class="box" x="663" y="372" width="234" height="72" rx="7"/><rect class="bar" x="663" y="372" width="3" height="72"/>
    <text class="t" x="679" y="394">Extraction</text><text class="s" x="679" y="412">NER · deontic · causal</text><text class="s" x="679" y="428">grounded LLM rules · number checks</text>
    <rect class="box" x="910" y="372" width="234" height="72" rx="7"/><rect class="bar" x="910" y="372" width="3" height="72"/>
    <text class="t" x="926" y="394">Explainability</text><text class="s" x="926" y="412">LIME · attention attribution</text><text class="s" x="926" y="428">stepwise reasoning trace</text>
    <rect class="box" x="416" y="456" width="234" height="72" rx="7"/><rect class="bar" x="416" y="456" width="3" height="72"/>
    <text class="t" x="432" y="478">Ask (RAG)</text><text class="s" x="432" y="496">plan · lookup · retrieve · gate</text><text class="s" x="432" y="512">generate · verify</text>
    <rect class="box" x="663" y="456" width="234" height="72" rx="7"/><rect class="bar" x="663" y="456" width="3" height="72"/>
    <text class="t" x="679" y="478">Simulation</text><text class="s" x="679" y="496">statutory calculator · population</text><text class="s" x="679" y="512">scenarios · clause-dynamics ABM</text>
    <rect class="box" x="910" y="456" width="234" height="72" rx="7"/><rect class="bar" x="910" y="456" width="3" height="72"/>
    <text class="t" x="926" y="478">Research harness</text><text class="s" x="926" y="496">experiments · backtest · Shapley</text><text class="s" x="926" y="512">sensitivity · error injection</text>
  </g>

  <!-- arrows to lower layer -->
  <path class="ar" d="M520 542 V558 H210 V574" marker-end="url(#a)"/>
  <path class="ar" d="M780 542 V574" marker-end="url(#a)"/>

  <!-- models -->
  <rect class="panel" x="40" y="574" width="340" height="156" rx="10"/>
  <text class="lab" x="58" y="594">MODEL BACKENDS</text>
  <rect class="box" x="56" y="604" width="308" height="36" rx="7"/>
  <text class="t" x="70" y="626">Ollama</text><text class="s" x="128" y="626">Phi-3.5 · fine-tuned export</text>
  <rect class="box" x="56" y="648" width="308" height="36" rx="7"/>
  <text class="t" x="70" y="670">Hosted</text><text class="s" x="128" y="670">Groq gpt-oss · OpenRouter · key rotation</text>
  <rect class="box" x="56" y="692" width="308" height="30" rx="7"/>
  <text class="s" x="70" y="711">MiniLM · cross-encoder · RapidOCR · spaCy</text>

  <!-- state -->
  <rect class="panel" x="400" y="574" width="760" height="156" rx="10"/>
  <text class="lab" x="416" y="594">STATE</text>
  <g>
    <rect class="db" x="416" y="604" width="136" height="112" rx="9"/>
    <text class="dbt" x="428" y="626">SQL</text><text class="s" x="428" y="644">SQLite or Postgres</text><text class="s" x="428" y="660">users · documents</text><text class="s" x="428" y="676">simulations</text><text class="s" x="428" y="692">API usage</text>
    <rect class="db" x="564" y="604" width="136" height="112" rx="9"/>
    <text class="dbt" x="576" y="626">Documents</text><text class="s" x="576" y="644">disk or Cloudflare R2</text><text class="s" x="576" y="660">atomic writes</text><text class="s" x="576" y="676">results · embeddings</text><text class="s" x="576" y="692">simulation runs</text>
    <rect class="db" x="712" y="604" width="136" height="112" rx="9"/>
    <text class="dbt" x="724" y="626">ChromaDB</text><text class="s" x="724" y="644">7.6k statute passages</text><text class="s" x="724" y="660">and user clauses</text><text class="s" x="724" y="676">hybrid retrieval</text>
    <rect class="db" x="860" y="604" width="136" height="112" rx="9"/>
    <text class="dbt" x="872" y="626">Statute corpus</text><text class="s" x="872" y="644">12 parsed texts</text><text class="s" x="872" y="660">exact offsets</text><text class="s" x="872" y="676">SHA-256 provenance</text>
    <rect class="db" x="1008" y="604" width="136" height="112" rx="9"/>
    <text class="dbt" x="1020" y="626">LLM cache</text><text class="s" x="1020" y="644">content-addressed</text><text class="s" x="1020" y="660">run manifests</text><text class="s" x="1020" y="676">offline reproduce</text>
  </g>
</svg>
